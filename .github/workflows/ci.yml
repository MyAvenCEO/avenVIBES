name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test ./tests
      - run: bun run lint
      - name: The site must still build with the framework
        run: |
          bun run site
          test -s site/index.html
      - name: Refuse to ship a credential
        # Cheap, and the failure it guards against is the kind you only notice
        # after it is public. The pattern is a character class so this file
        # cannot match itself.
        run: |
          pattern='_authToken=[a-z]\{2,4\}_'
          if git grep -nI "$pattern" -- . >/dev/null 2>&1; then
            echo "::error::A registry token is present in a tracked file."
            exit 1
          fi
